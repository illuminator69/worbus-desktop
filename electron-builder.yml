appId: app.worbus.desktop
productName: Worbus
executableName: worbus
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
electronVersion: 43.7.0
directories:
    buildResources: assets
files:
    - 'out/**/*'
    - 'package.json'
extraResources:
    - assets/**
asarUnpack:
    - resources/**
win:
    target:
        - target: zip
          arch:
              - x64
              - arm64
        - target: nsis
          arch:
              - x64
              - arm64
    icon: assets/icons/icon.ico

nsis:
    allowToChangeInstallationDirectory: true
    oneClick: false
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always

mac:
    target:
        - target: dmg
          arch:
              - arm64
              - x64
        - target: zip
          arch:
              - arm64
              - x64
    icon: media/feishin.icon
    type: distribution
    hardenedRuntime: false
    identity: "-"
    entitlements: build/entitlements.mac.plist
    entitlementsInherit: build/entitlements.mac.plist
    gatekeeperAssess: false
    notarize: false
    extendInfo:
        NSAudioCaptureUsageDescription: 'System audio access is required for mpv visualizer capture in Worbus'
        NSLocalNetworkUsageDescription: 'Local network is necessary for accessing servers hosted on the same system as Worbus'

dmg:
    contents: [{ x: 130, y: 220 }, { x: 410, y: 220, type: link, path: /Applications }]

linux:
    target:
        - AppImage
        - deb
        - tar.xz
    category: AudioVideo;Audio;Player
    icon: assets/icons/icon.png
    artifactName: ${productName}-${os}-${arch}.${ext}

toolsets:
    appimage: '1.0.3'

npmRebuild: false
afterAllArtifactBuild: scripts/after-all-artifact-build.mjs
# Worbus P4 (design §6.9): the fork, never upstream. CI builds with `--publish never` and its own
# job drafts the release (.github/workflows/release.yml). Nothing reads this at run time: a packaged
# build never constructs the updater (src/main/index.ts), so the app-update.yml it writes into the
# build is not consulted.
publish:
    provider: github
    owner: illuminator69
    repo: worbus-desktop
    channel: latest
    releaseType: draft