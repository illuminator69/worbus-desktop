name: Bug report
description: Something in Worbus for desktop does not work.
title: '[Bug]: '
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: |
              Worbus keeps every bug in one place: https://github.com/illuminator69/worbus/issues.
              Filing here is fine too when you know it is Worbus for desktop.

    - type: input
      id: version
      attributes:
          label: Worbus for desktop version
          description: The app menu's Version line, with its commit.
          placeholder: ex. 0.5.0 (abc1234)
      validations:
          required: true

    - type: input
      id: worbus-server-version
      attributes:
          label: Worbus Server version
          description: Settings › Server shows it while connected. Write "none" without a Worbus Server.
          placeholder: ex. 0.5.0 (abc1234)
      validations:
          required: true

    - type: input
      id: server-version
      attributes:
          label: Music server and version
          placeholder: ex. Navidrome 0.58.0
      validations:
          required: true

    - type: dropdown
      id: environments
      attributes:
          label: Where do you see it?
          multiple: true
          options:
              - Desktop Windows
              - Desktop macOS
              - Desktop Linux
              - Web
              - Other (say which below)

    - type: textarea
      id: what-happened
      attributes:
          label: What happened, and what did you expect?
          placeholder: Screenshots help.
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Go to '...'
              2. Click on '....'
              3. See error
      validations:
          required: true

    - type: textarea
      id: logs
      attributes:
          label: The logs file
          description: Settings › Advanced › Logger › Export diagnostics makes a zip with passwords, tokens and secrets removed. Attach it here.
